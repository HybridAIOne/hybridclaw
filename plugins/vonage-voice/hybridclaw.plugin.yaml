id: vonage-voice
name: Vonage Voice
version: 0.1.0
kind: channel
description: Inbound and outbound phone calls through the Vonage Voice API, turn-based or realtime speech-to-speech.
entrypoint: src/index.js
requires:
  node: 22.x
credentials:
  - VONAGE_PRIVATE_KEY
  - VONAGE_SIGNATURE_SECRET
configSchema:
  type: object
  additionalProperties: false
  required:
    - applicationId
    - fromNumber
    - publicBaseUrl
  properties:
    applicationId:
      type: string
      minLength: 1
    fromNumber:
      type: string
      pattern: '^\\+[1-9][0-9]{7,14}$'
    publicBaseUrl:
      type: string
      pattern: '^https://'
    callerPolicy:
      type: string
      enum: [open, allowlist, disabled]
      default: open
    allowFrom:
      type: array
      default: []
      items:
        type: string
    mode:
      type: string
      enum: [turn, realtime]
      default: turn
    language:
      type: string
      default: en-US
    welcomeGreeting:
      type: string
      default: Hello! How can I help you today?
    interruptible:
      type: boolean
      default: true
    maxConcurrentCalls:
      type: integer
      default: 8
      minimum: 1
      maximum: 100
configUiHints:
  applicationId:
    label: Application ID
  callerPolicy:
    label: Caller Policy
  allowFrom:
    label: Allowed Callers
    placeholder: '+4915123456789'
  mode:
    label: Call Mode
  fromNumber:
    label: Vonage Number
    placeholder: '+14155550123'
  publicBaseUrl:
    label: Public Gateway URL
    placeholder: https://voice.example.com
